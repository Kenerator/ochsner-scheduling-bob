# Optional: review/adopt into .github/workflows/ explicitly.
# Official tag refs verified 2026-10-09; re-review pins on intentional update.
name: Offline Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.13'
      - run: python -m pip install -r reference/bootstrap/tooling-requirements.txt
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: poc-demo --scenario success
      - run: poc-demo --scenario failure
# No live model, credentials, deployment or publication. Do not require this
# branch check until the exact adopted job has run successfully in that repo.
