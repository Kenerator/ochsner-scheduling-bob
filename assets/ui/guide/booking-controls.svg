<svg xmlns="http://www.w3.org/2000/svg" width="920" height="810" viewBox="0 0 920 810" role="img" aria-labelledby="title desc">
<title id="title">Booking control locations</title><desc id="desc">Expanded private identity, availability and lookup controls, returned selection and separate confirmation.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b41;font-size:18px}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:16px;fill:#43566a}.button{font-size:17px;font-weight:600}.line{stroke:#6d849b;stroke-width:2;fill:none}</style>
<rect width="920" height="810" fill="#fff"/>
<text x="28" y="42" class="title">Booking controls: review, then confirm</text><text x="28" y="72" class="small">Schematic—not a screenshot · control locations only</text><rect x="28" y="96" width="864" height="194" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="128" class="head">2 · Private synthetic identity (expanded)</text><text x="48" y="165" class="small">Synthetic phone</text><rect x="48" y="174" width="250" height="34" rx="10" fill="#fff" stroke="#94a8bb"/><text x="320" y="165" class="small">Date of birth</text><rect x="320" y="174" width="250" height="34" rx="10" fill="#fff" stroke="#94a8bb"/><text x="592" y="165" class="small">ZIP discriminator</text><rect x="592" y="174" width="278" height="34" rx="10" fill="#fff" stroke="#94a8bb"/><rect x="48" y="232" width="294" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="257" class="button">Check or correct identity</text><rect x="28" y="310" width="864" height="226" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="342" class="head">3 · Review returned options</text><rect x="48" y="365" width="280" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="390" class="button">Get current availability</text><rect x="348" y="365" width="300" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="360" y="390" class="button">Look up my appointments</text><rect x="48" y="422" width="822" height="88" rx="10" fill="#fff" stroke="#94a8bb"/><text x="66" y="452">Returned appointment details appear here</text><rect x="66" y="465" width="225" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="78" y="490" class="button">Select option [number]</text><rect x="28" y="556" width="864" height="188" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="588" class="head">4 · Confirm the exact appointment</text><rect x="48" y="610" width="822" height="48" rx="10" fill="#fff" stroke="#94a8bb"/><text x="66" y="640">Exact returned proposal appears here — review before confirming</text><rect x="48" y="681" width="244" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="706" class="button">Confirm appointment</text><rect x="312" y="681" width="310" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="324" y="706" class="button">Decline / change my mind</text><text x="28" y="782" class="small">Empty fields/placeholders only. Selection does not book; Confirm is a separate action.</text>
</svg>
