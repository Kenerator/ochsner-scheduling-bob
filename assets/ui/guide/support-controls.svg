<svg xmlns="http://www.w3.org/2000/svg" width="920" height="804" viewBox="0 0 920 804" role="img" aria-labelledby="title desc">
<title id="title">Support pairing and control schematic</title><desc id="desc">Separate patient and Support tabs, joining versus taking control, and patient-only adoption after Return.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b41;font-size:18px}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.small{font-size:16px;fill:#43566a}.button{font-size:17px;font-weight:600}.line{stroke:#6d849b;stroke-width:2;fill:none}</style>
<rect width="920" height="804" fill="#fff"/>
<text x="28" y="42" class="title">Pairing is not control or consent</text><text x="28" y="72" class="small">Schematic—not a screenshot · control locations only</text><rect x="28" y="96" width="864" height="96" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="128" class="head">Patient tab · session toolbar</text><rect x="48" y="143" width="322" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="168" class="button">Create support pairing grant</text><text x="48" y="222" class="small">Use the one-use value only in the separate local test tab.</text><rect x="28" y="242" width="864" height="130" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="274" class="head">Separate tab · same widget, Support role after joining</text><text x="48" y="307" class="small">One-use pairing grant</text><rect x="48" y="316" width="400" height="34" rx="10" fill="#fff" stroke="#94a8bb"/><rect x="474" y="316" width="232" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="486" y="341" class="button">Join demo support</text><rect x="28" y="392" width="864" height="184" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="424" class="head">Paired demo support panel · joined can be inactive</text><rect x="48" y="447" width="230" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="472" class="button">Take demo control</text><rect x="298" y="447" width="254" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="310" y="472" class="button">Return patient control</text><text x="48" y="514" class="small">Suggested public location</text><rect x="48" y="523" width="350" height="34" rx="10" fill="#fff" stroke="#94a8bb"/><rect x="420" y="523" width="386" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="432" y="548" class="button">Suggest preference — not adoption</text><rect x="28" y="596" width="864" height="114" rx="10" fill="#f2f6fa" stroke="#94a8bb"/><text x="46" y="628" class="head">Patient tab · only after Return</text><rect x="48" y="650" width="388" height="38" rx="10" fill="#e7eff8" stroke="#6d849b"/><text x="60" y="675" class="button">Accept reviewed support suggestion</text><text x="28" y="748" class="small">Joining, takeover, suggestion and patient adoption are separate actions.</text><text x="28" y="776" class="small">No private identity values, grant value or confirmation authority is shown.</text>
</svg>
